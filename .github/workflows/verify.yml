# NightDesk 验证闸门。
#
# Windows 作业是唯一能在真实 Windows 运行时上跑全部断言的自动化位置：
# Microsoft.WindowsDesktop.App、DPAPI(crypt32) 和 nx-host.exe 本身都只存在于 Windows。
# 它同时产出可直接下载做人工验收的更新 ZIP（release.json + NightDesk.exe + nx-host.exe）。
#
# Android 作业只做单元测试、lint 和 debug 构建；可安装的 release APK 由 AI 主机用
# 仓库内签名密钥构建，见 docs 中的协同指南。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows build, tests and package
    runs-on: windows-latest
    steps:
      # 两台开发机都用 core.autocrlf=input，工作树是 LF。Git for Windows 默认会转成
      # CRLF，先固定成 LF，避免 CI 与开发机的源码文本/断言基线不一致。
      - name: Pin LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --version
          dotnet --list-sdks
          'nx-host.exe: {0} bytes' -f (Get-Item src/NightDesk/Assets/nx-host/nx-host.exe).Length
          'mobile.aar: {0} bytes' -f (Get-Item android/app/libs/mobile.aar).Length

      - name: Build Release (warnings are errors)
        shell: pwsh
        run: dotnet build tests/NightDesk.Tests/NightDesk.Tests.csproj -c Release -warnaserror

      - name: Run Windows test suite
        shell: pwsh
        run: dotnet run --project tests/NightDesk.Tests/NightDesk.Tests.csproj -c Release --no-build

      - name: Publish self-contained win-x64
        shell: pwsh
        run: ./tools/publish-windows.ps1 -Dotnet dotnet

      - name: Package update ZIP
        id: package
        shell: pwsh
        run: |
          [xml] $project = Get-Content -Raw src/NightDesk/NightDesk.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected <Version>: $version" }
          $parts = $version.Split('.')
          $versionCode = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          ./tools/package-windows.ps1 -Version $version -VersionCode $versionCode
          "version=$version" >> $env:GITHUB_OUTPUT
          "versionCode=$versionCode" >> $env:GITHUB_OUTPUT

      - name: Upload Windows package for manual acceptance
        uses: actions/upload-artifact@v4
        with:
          name: nightdesk-windows-${{ steps.package.outputs.version }}
          path: artifacts/windows-packages/nightdesk-windows-${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages used by compileSdk 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle (no wrapper in repo)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon --console=plain testDebugUnitTest lintRelease assembleDebug

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightdesk-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
