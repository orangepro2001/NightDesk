# NightDesk 验证闸门。
#
# Windows 作业是唯一能在真实 Windows 运行时上跑全部断言的自动化位置：
# Microsoft.WindowsDesktop.App、DPAPI(crypt32) 和 nx-host.exe 本身都只存在于 Windows。
# 它同时产出可直接下载做人工验收的更新 ZIP（release.json + NightDesk.exe + nx-host.exe）。
#
# Android 作业只做单元测试、lint 和 debug 构建；可安装的 release APK 由 AI 主机用
# 仓库内签名密钥构建，见 docs/20261028-123000-dev-test-collaboration.md。
name: verify

on:
  push:
    branches: [main]
    # 纯文档提交不值得跑 10 分钟的模拟器作业；需要时用 workflow_dispatch 手动补跑。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows build, tests and package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # 两台开发机都用 core.autocrlf=input，工作树是 LF。Git for Windows 默认会转成
      # CRLF，先固定成 LF，避免 CI 与开发机的源码文本/断言基线不一致。
      - name: Pin LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --version
          dotnet --list-sdks
          'nx-host.exe: {0} bytes' -f (Get-Item src/NightDesk/Assets/nx-host/nx-host.exe).Length
          'mobile.aar: {0} bytes' -f (Get-Item android/app/libs/mobile.aar).Length

      - name: Build Release (warnings are errors)
        shell: pwsh
        run: dotnet build tests/NightDesk.Tests/NightDesk.Tests.csproj -c Release -warnaserror

      # 先跑一次 sidecar，既做冒烟检查，也把 7.9 MB 的 PE 预热进文件缓存：
      # 冷启动 runner 上首次执行会被杀毒/索引拖慢，可能吃掉 NxHostClient 的 15 秒就绪窗口。
      - name: Warm the sidecar binary cache
        shell: pwsh
        run: |
          $output = & ./src/NightDesk/Assets/nx-host/nx-host.exe -version
          if ($LASTEXITCODE -ne 0) { throw "nx-host.exe -version failed with $LASTEXITCODE" }
          $output

      - name: Run Windows test suite
        shell: pwsh
        run: |
          # 单个测试是时间敏感的（sidecar 必须在 15 秒内报告 ready，见 NxHostClient），
          # 冷 runner 上偶发超时。失败后重试一次；真实回归会连续失败两次。
          dotnet run --project tests/NightDesk.Tests/NightDesk.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "first attempt failed with exit code $LASTEXITCODE; retrying once"
            dotnet run --project tests/NightDesk.Tests/NightDesk.Tests.csproj -c Release --no-build
          }

      - name: Publish self-contained win-x64
        shell: pwsh
        run: ./tools/publish-windows.ps1 -Dotnet dotnet

      - name: Package update ZIP
        id: package
        shell: pwsh
        run: |
          [xml] $project = Get-Content -Raw src/NightDesk/NightDesk.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected <Version>: $version" }
          $parts = $version.Split('.')
          $versionCode = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          ./tools/package-windows.ps1 -Version $version -VersionCode $versionCode
          "version=$version" >> $env:GITHUB_OUTPUT
          "versionCode=$versionCode" >> $env:GITHUB_OUTPUT

      - name: Upload Windows package for manual acceptance
        uses: actions/upload-artifact@v7
        with:
          name: nightdesk-windows-${{ steps.package.outputs.version }}
          path: artifacts/windows-packages/nightdesk-windows-${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (accepts licenses, adds platform-tools)
        uses: android-actions/setup-android@v4

      - name: Install SDK packages used by compileSdk 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle (no wrapper in repo)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon --console=plain testDebugUnitTest lintRelease assembleDebug

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: nightdesk-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # 把仪器测试从 AI 主机搬到这里：标准 ubuntu-latest runner 有 KVM，模拟器是硬件加速的，
  # 不再需要在 AI 主机上长期挂一个纯软件模拟的 qemu（实测常驻约 10 GiB RSS 加满 swap）。
  # UpdateFlowInstrumentedTest 需要 tailnet 更新源，故意留在这里之外。
  android-instrumented:
    name: Android instrumented tests (KVM emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 标准 runner 默认只有 root 能访问 /dev/kvm，这条 udev 规则让 runner 用户可用。
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          free -h

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (accepts licenses, adds platform-tools)
        uses: android-actions/setup-android@v4

      - name: Install SDK packages used by compileSdk 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle (no wrapper in repo)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      # testBuildType=release，所以 release APK 必须签名才能和 androidTest APK 一起安装。
      # CI 用一次性密钥：测试不关心签名身份，只有「两个 APK 用同一把钥匙」这一条硬要求。
      # 正式发布签名仍然只在 AI 主机，从不进 CI。
      - name: Generate an ephemeral test signing key
        working-directory: android
        run: |
          keydir="$RUNNER_TEMP/nightdesk-ci-signing"
          mkdir -p "$keydir"
          chmod 700 "$keydir"
          openssl rand -base64 48 > "$keydir/password"
          keytool -genkeypair -noprompt -keystore "$keydir/release.p12" -storetype PKCS12 \
            -storepass:file "$keydir/password" -alias nightdesk -keyalg RSA -keysize 3072 \
            -validity 1 -dname 'CN=NightDesk CI Only'
          {
            echo "NIGHTDESK_KEYSTORE=$keydir/release.p12"
            echo "NIGHTDESK_STORE_PASSWORD=$(cat "$keydir/password")"
          } >> "$GITHUB_ENV"

      - name: Build release and androidTest APKs
        working-directory: android
        run: gradle --no-daemon --console=plain assembleRelease assembleReleaseAndroidTest

      - name: Run instrumented tests on the emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            set -e
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb install -r android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w \
              -e class dev.nightdesk.android.HostStoreInstrumentedTest,dev.nightdesk.android.MainUiInstrumentedTest,dev.nightdesk.android.RemoteControlUiInstrumentedTest \
              dev.nightdesk.android.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/instrumented.log
            grep -q 'OK (' /tmp/instrumented.log
